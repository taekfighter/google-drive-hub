        <title>Google Drive - Loading...</title>
        <style>
            body,
            html {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #121212;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: sans-serif;
            }
        </style>
        <link rel="icon" type="image/png" href="https://ssl.gstatic.com/docs/doclist/images/drive_favicon_2026_32dp.png">
    </head>
    <body>
        <div style="color: white; text-align: center;">
            <p>Click To Load Google Drive....</p>
            <p style="font-size: 0.8rem; color: #555;">If the page doesn't open, check for a pop-up blocker.</p>
        </div>
        <script>
            // --- SECURITY & ANTI-INSPECTION SCRIPTS ---
            
            // 1. Disable Right-Click
            document.addEventListener('contextmenu', (e) => e.preventDefault());

            // 2. Disable Key Combinations
            document.addEventListener('keydown', (e) => {
                // Check for: F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U, Ctrl+S
                if (
                    e.keyCode === 123 || 
                    (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
                    (e.ctrlKey && e.keyCode === 85) ||
                    (e.ctrlKey && e.keyCode === 83)
                ) {
                    e.preventDefault();
                    return false;
                }
            });

            // 3. The "Debugger Trap"
            (function() {
                const tester = setInterval(() => {
                    const start = performance.now();
                    debugger; 
                    const end = performance.now();
                    if (end - start > 100) {
                        console.clear();
                        console.log("Developer tools are disabled for security.");
                    }
                }, 1000);
            })();

            // --- ORIGINAL SITE LAUNCH LOGIC ---

            function launchSite() {
                var url = "tools/login.html";
                var win = window.open('about:blank', '_blank');
                if (win) {
                    var savedTitle = (localStorage.getItem('setting_tab_title') || 'Home - Google Drive').replace(/\\/g,'\\\\').replace(/'/g,"'");
                    var savedIcon  = (localStorage.getItem('setting_tab_icon') || 'https://ssl.gstatic.com/docs/doclist/images/drive_favicon_2026_32dp.png').replace(/'/g,"'").replace(/\\/g,'\\\\');
                    var iframe = win.document.createElement('iframe');
                    iframe.style = "position:fixed; top:0; left:0; width:100%; height:100%; border:none; z-index:1;";
                    iframe.src = url;
                    win.document.body.appendChild(iframe);
                    // Tab Identity Keeper
                    var keeper = win.document.createElement('script');
                    keeper.textContent = [
                        "(function(){",
                        "if(window.__clockerKeeperActive)return;window.__clockerKeeperActive=true;",
                        "function ls(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}",
                        "function hd(){var h=document.head;if(!h){h=document.createElement('head');(document.documentElement||document).appendChild(h);}return h;}",
                        "function setIco(h){",
                        "  if(!h)return;",
                        "  var head=hd();",
                        "  var existing=head.querySelectorAll('link[rel=\"icon\"],link[rel=\"shortcut icon\"]');",
                        "  for(var k=0;k<existing.length;k++){existing[k].parentNode.removeChild(existing[k]);}",
                        "  var fresh=document.createElement('link');",
                        "  fresh.rel='icon';fresh.type='image/png';fresh.href=h;",
                        "  head.appendChild(fresh);",
                        "}",
                        "var D_T='" + savedTitle + "';",
                        "var D_I='" + savedIcon + "';",
                        "var lastT='',lastI='';",
                        "function sync(){",
                        "  var t=ls('setting_tab_title')||D_T;",
                        "  var i=ls('setting_tab_icon')||D_I;",
                        "  if(t&&t!==lastT){lastT=t;document.title=t;}",
                        "  if(i&&i!==lastI){lastI=i;setIco(i);}",
                        "}",
                        "sync();",
                        "setInterval(sync,400);",
                        "window.addEventListener('message',function(e){",
                        "  if(!e.data||e.data.type!=='_clocker_tab_identity')return;",
                        "  var did=false;",
                        "  if(e.data.title!=null){lastT=e.data.title;document.title=e.data.title;did=true;}",
                        "  if(e.data.icon!=null){lastI=e.data.icon;setIco(e.data.icon);did=true;}",
                        "  if(!did)sync();",
                        "});",
                        "})();"
                    ].join('\n');
                    win.document.body.appendChild(keeper);
                    window.location.replace("https://schoology.pointschools.net/");
                } else {
                    // Pop-up blocked: wait for a single click to retry, then
                    // remove the handler so extra clicks after a successful
                    // open can't spawn additional tabs.
                    document.body.onclick = function () {
                        document.body.onclick = null;
                        launchSite();
                    };
                }
            }

            // AUTO-LAUNCH on load
            window.onload = function() {
                launchSite();
            };
        </script>
    </body>
</html>
