<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Powerline.io</title>
    <script>
      let inFrame;
      try {
        inFrame = window !== top;
      } catch (e) {
        inFrame = true;
      }
      if (!localStorage.getItem("ab")) localStorage.setItem("ab", true);
      if (!inFrame && !navigator.userAgent.includes("Firefox") && localStorage.getItem("ab") === "true") {
        const popup = open("about:blank", "_blank");
        setTimeout(() => {
          if (!popup || popup.closed) {
            alert("Please allow popups for this site. Doing so will allow us to open the site in a about:blank tab and preventing this site from showing up in your history. You can turn this off in the site settings.");
          } else {
            const doc = popup.document;
            const iframe = doc.createElement("iframe");
            const style = iframe.style;
            const link = doc.createElement("link");
            const name = localStorage.getItem("name") || "My Drive - Google Drive";
            const icon = localStorage.getItem("icon") || "https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png";
            doc.title = name;
            link.rel = "icon";
            link.href = icon;
            iframe.src = location.href;
            style.position = "fixed";
            style.top = style.bottom = style.left = style.right = 0;
            style.border = style.outline = "none";
            style.width = style.height = "100%";
            doc.head.appendChild(link);
            doc.body.appendChild(iframe);
            const script = doc.createElement("script");
            script.textContent = `
      window.onbeforeunload = function (event) {
        const confirmationMessage = 'Leave Site?';
        (event || window.event).returnValue = confirmationMessage;
        return confirmationMessage;
      };
    `;
            doc.head.appendChild(script);
            location.replace("https://schoology.pointschools.net/")
          }
        }, 0);
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerline.io — Core Game</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      .game-container {
        width: 100vw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: #111;
      }

      .game-scale {
        width: 1280px;
        height: 720px;
        transform-origin: center center;
      }

      .game-frame {
        display: block;
        width: 1280px;
        height: 720px;
        border: 0;
        background: #000;
      }

      @media (max-width: 1280px),
      (max-height: 720px) {
        .game-scale {
          transform: scale(min(calc(100vw / 1280),
                calc(100dvh / 720)));
        }
      }
    </style>
  </head>
  <body>
    <main class="game-container">
      <iframe class="game-frame" src="https://powerline.coolmathgames.com/" allowfullscreen scrolling="no"></iframe>
    </main>
  </body>
</html>
